# LLVM 20.1 toolchain prefix (override with LLVM_SYS_201_PREFIX).
# inkwell feature `llvm20-1` -> llvm-sys 201.x reads this prefix.
[env]
LLVM_SYS_201_PREFIX = { value = "/Users/mind/orca/toolchains/llvm20", force = false }
# bdwgc-alloc-sys (crates.io) builds bdwgc via cmake-rs without a way to pass CMake
# options; the reference C++ build uses enable_large_config=ON, whose heap-growth policy
# (MINHINCR/MAXHINCR) avoids ~7x more collections. cmake-rs takes C flags from cc,
# which reads CFLAGS_<target> (TARGET_CFLAGS only applies when cross-compiling).
# The define is inert for the other C builds (liblzma, typhon-omp shim).
# See crates/runtime/README.md.
CFLAGS_aarch64_apple_darwin = { value = "-DLARGE_CONFIG -mmacosx-version-min=11.0", force = false }
CFLAGS_x86_64_apple_darwin = { value = "-DLARGE_CONFIG -mmacosx-version-min=11.0", force = false }
CFLAGS_x86_64_unknown_linux_gnu = { value = "-DLARGE_CONFIG -mmacosx-version-min=11.0", force = false }
CFLAGS_aarch64_unknown_linux_gnu = { value = "-DLARGE_CONFIG -mmacosx-version-min=11.0", force = false }
TYPHON_STDLIB_DIR = { value = "stdlib", relative = true, force = false }
# Programs are linked against libtyphonrt.a: build its C parts (bdwgc, liblzma, omp shim)
# for the same macOS baseline as rustc (11.0) so ld does not warn "built for newer macOS".
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = false }

[build]
target-dir = "target"
# Incremental caches are large; disk on the dev machine is tight.
incremental = false
