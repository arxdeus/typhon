name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (semver, without leading v), e.g. 0.2.0"
        required: true
        type: string
      build_only:
        description: "Build and test artifacts without changing versions, tags, or releases"
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_ONLY: ${{ inputs.build_only }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        run: |
          v="$RELEASE_VERSION"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad version: $v"; exit 1; }
          if [ "$BUILD_ONLY" != true ] && git rev-parse "v$v" >/dev/null 2>&1; then echo "tag v$v already exists"; exit 1; fi
      - name: Bump workspace version
        if: ${{ !inputs.build_only }}
        run: |
          sed -i -E '/^\[workspace\.package\]/,/^\[/ s/^version = ".*"/version = "${{ inputs.version }}"/' Cargo.toml
          grep -n '^version' Cargo.toml
          # refresh Cargo.lock entries of workspace crates without touching deps
          sed -i -E '/^name = "typhon(-[a-z-]+)?"$/{n;s/^version = ".*"/version = "${{ inputs.version }}"/}' Cargo.lock
      - id: commit
        name: Commit and tag
        run: |
          if [ "$BUILD_ONLY" != true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            if ! git diff --cached --quiet; then git commit -m "chore(release): v$RELEASE_VERSION"; fi
            git tag "v$RELEASE_VERSION"
            git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "v$RELEASE_VERSION"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20 zstd cmake
          echo "LLVM_SYS_201_PREFIX=$(brew --prefix llvm@20)" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix zstd)/lib:$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install LLVM 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y llvm-20-dev libpolly-20-dev libomp-20-dev libzstd-dev libxml2-dev zlib1g-dev cmake clang-20
          {
            echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-20"
            echo "CC=clang-20"
            echo "CXX=clang++-20"
            echo "CFLAGS_x86_64_unknown_linux_gnu=-DLARGE_CONFIG -DNO_BLACK_LISTING"
            echo "CFLAGS_aarch64_unknown_linux_gnu=-DLARGE_CONFIG -DNO_BLACK_LISTING"
          } >> "$GITHUB_ENV"
          printf '#include <omp.h>\n' | clang-20 -fopenmp -x c -fsyntax-only -

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install LLVM 20 + OpenBLAS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/setup-windows.ps1

      - name: Build
        shell: bash
        run: cargo build --locked --release -p typhon-cli -p typhon-runtime

      - name: Smoke test
        shell: bash
        run: |
          printf 'print("hello from typhon")\n' > hello.py
          TYPHON_STDLIB_DIR="$PWD/stdlib" ./target/release/typhon run hello.py

      - name: Package
        id: pkg
        shell: bash
        run: |
          name="typhon-v${{ inputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name/bin" "dist/$name/lib/typhon"
          cp -R stdlib "dist/$name/lib/typhon/stdlib"
          # Generated Unicode and float tables must travel with the package, not
          # depend on the CI worker's compile-time OUT_DIR.
          tar -xzf tools/unicode/tables-16.0.0.tar.gz -C "dist/$name/lib/typhon/stdlib"
          cp README.md LICENSE NOTICE "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            blas="$(cygpath -u "$OPENBLAS_ROOT")"
            cp target/release/typhon.exe "$blas"/bin/*.dll "dist/$name/bin/"
            cp target/release/typhonrt.lib "$blas/lib/libopenblas.lib" "dist/$name/lib/typhon/"
            (cd dist && 7z a -tzip -bso0 "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            cp target/release/typhon "dist/$name/bin/"
            cp target/release/libtyphonrt.a "dist/$name/lib/typhon/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Test installed package
        shell: bash
        run: python tools/ci/smoke-package.py "dist/${{ steps.pkg.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    if: ${{ !inputs.build_only }}
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Changelog from conventional commits
        run: |
          tag="v${{ inputs.version }}"
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          range="${prev:+$prev..}$tag"
          {
            echo "## Changes${prev:+ since $prev}"
            for t in "feat:Features" "fix:Bug fixes" "perf:Performance" "refactor:Refactoring" "docs:Documentation" "test:Tests" "build:Build" "ci:CI" "chore:Chores" "revert:Reverts"; do
              k="${t%%:*}"; title="${t#*:}"
              lines="$(git log --no-merges --format='- %s (%h)' "$range" | grep -E "^- $k(\(|!|:)" || true)"
              if [ -n "$lines" ]; then printf '\n### %s\n%s\n' "$title" "$lines"; fi
            done
          } > CHANGELOG.md
          head -c 120000 CHANGELOG.md > NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Typhon v${{ inputs.version }}
          body_path: NOTES.md
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
