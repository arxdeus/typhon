[package]
name = "typhon-omp"
description = "OpenMP runtime in Rust: implements the __kmpc_* / omp_* C ABI used by the stdlib openmp module (replaces LLVM libomp)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
# rlib: linked into libtyphonrt; cdylib: drop-in `libomp.dylib` for oracle runs.
crate-type = ["rlib", "cdylib"]

[dependencies]
libc.workspace = true
parking_lot.workspace = true
crossbeam-utils.workspace = true
crossbeam-deque.workspace = true
once_cell.workspace = true

[build-dependencies]
cc.workspace = true
