[package]
name = "typhon-testsuite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
typhon-common.workspace = true
libtest-mimic.workspace = true
tempfile.workspace = true
regex.workspace = true

# End-to-end `.codon` suites (port of test/main.cpp). Uses libtest-mimic.
[[test]]
name = "e2e"
path = "tests/e2e.rs"
harness = false

# In-process unit tests (ports of test/types.cpp, test/cir/**, test/dsl/**).
[[test]]
name = "unit"
path = "tests/unit/main.rs"
