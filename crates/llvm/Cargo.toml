[package]
name = "typhon-llvm"
description = "LLVM backend: CIR -> LLVM IR codegen, optimization pipeline, GPU, native target features"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
typhon-common.workspace = true
typhon-ir.workspace = true
inkwell.workspace = true
llvm-sys.workspace = true
libc.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
once_cell.workspace = true
parking_lot.workspace = true

[dev-dependencies]
# Execution tests link objects with `libtyphonrt.a` from target/<profile> (build
# it first: `cargo build -p typhon-runtime`).
tempfile.workspace = true

[build-dependencies]
cc = "1"
