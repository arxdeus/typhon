[package]
name = "typhon-cli"
description = "Typhon CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "typhon"
path = "src/main.rs"

[features]
embed-stdlib = ["typhon-compiler/embed-stdlib"]

[dependencies]
typhon-common.workspace = true
typhon-compiler.workspace = true
typhon-llvm.workspace = true
typhon-ir.workspace = true
tempfile.workspace = true
libc.workspace = true
# libtyphonrt.a is linked into every program built by `run`/`build`; `cargo build`
# (default-members) puts it into target/<profile>, next to `typhon`.
