[package]
name = "typhon-compiler"
description = "Compiler driver (port of codon/compiler/compiler.{h,cpp})"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Embed ../stdlib into the binary (replaces cmrc ResourceFilesystem).
embed-stdlib = []

[dependencies]
typhon-common.workspace = true
typhon-ir.workspace = true
typhon-ir-analyze.workspace = true
typhon-ir-transform.workspace = true
typhon-parser.workspace = true
typhon-dsl.workspace = true
typhon-llvm.workspace = true
include_dir.workspace = true
libloading.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
typhon-parser.workspace = true
typhon-ir.workspace = true
typhon-dsl.workspace = true

# Plugin fixtures for tests/plugins.rs (ports of test/dsl/library.cpp).
[[example]]
name = "typhon_test_plugin_compiler"
path = "tests/fixtures/plugin_compiler.rs"
crate-type = ["cdylib"]

[[example]]
name = "typhon_test_plugin_runtime"
path = "tests/fixtures/plugin_runtime.rs"
crate-type = ["cdylib"]
