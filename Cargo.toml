[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/ir",
    "crates/ir-analyze",
    "crates/ir-transform",
    "crates/parser",
    "crates/llvm",
    "crates/runtime",
    "crates/omp",
    "crates/compiler",
    "crates/cli",
    "crates/testsuite",
]
default-members = [
    "crates/common",
    "crates/ir",
    "crates/ir-analyze",
    "crates/ir-transform",
    "crates/parser",
    "crates/llvm",
    "crates/runtime",
    "crates/omp",
    "crates/compiler",
    "crates/cli",
    "crates/testsuite",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/typhon-lang/typhon"
authors = ["Typhon contributors"]

[workspace.dependencies]
# ---- internal crates ----
typhon-common = { path = "crates/common" }
typhon-ir = { path = "crates/ir" }
typhon-ir-analyze = { path = "crates/ir-analyze" }
typhon-ir-transform = { path = "crates/ir-transform" }
typhon-parser = { path = "crates/parser" }
typhon-llvm = { path = "crates/llvm" }
typhon-runtime = { path = "crates/runtime" }
typhon-omp = { path = "crates/omp" }
typhon-compiler = { path = "crates/compiler" }

# ---- core data structures ----
la-arena = "0.3.1"            # index arenas for IR / AST / type graph (replaces raw pointers)
indexmap = "2.14"             # ordered maps (std::map / insertion-ordered tables)
rustc-hash = "2.1"            # fast hashing (std::unordered_map)
smallvec = "1.15"             # small vectors (llvm::SmallVector)
bitflags = "2.13"             # flag sets (Logger flags, Attr flags)
ordered-float = "5.5"         # float keys in maps
ustr = "1.1"                  # interned strings (interned identifiers)
petgraph = "0.8"              # CFG / dominators (cir/analyze/dataflow)
ena = "0.14"                  # union-find for type unification (LinkType)
once_cell = "1.21"
parking_lot = "0.12"

# ---- text / formatting / errors ----
thiserror = "2.0"
anyhow = "1.0"
codespan-reporting = "0.13"   # compiler diagnostics (compilationError / Warning)
unicode-width = "0.2"
unicode-segmentation = "1.13" # utf8_strlen / utf8_substr
memchr = "2.7"
ryu = "1.0"                   # float -> shortest string (AST float formatting)
itoa = "1.0"
lexical-core = "1.0"          # string -> number for literals
fast-float2 = "0.2"           # fast_float (runtime float parsing)

# ---- parsing ----
peg = "0.8.6"                 # PEG grammar (replaces cpp-peglib + peg2cpp)

# ---- serialization / config ----
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
postcard = { version = "1.1", features = ["use-std"] } # replaces util/tser.h + serialize.h
toml = "1.2"                 
semver = "1.0"                # Neargye/semver

# ---- CLI / env ----
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "7.0"
which = "8.0"
tempfile = "3.20"
glob = "0.3"
include_dir = "0.7"           # embedded stdlib (replaces cmrc resource fs)
libloading = "0.9"            # dlopen (JIT symbol resolution)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---- LLVM ----
inkwell = { version = "0.11", default-features = false, features = ["llvm20-1", "target-aarch64", "target-x86", "target-arm", "target-nvptx"] }
llvm-sys = { package = "llvm-sys", version = "201.1" }

# ---- runtime (libtyphonrt) ----
libc = "0.2"
bdwgc-alloc = { version = "0.6", default-features = false, features = ["cmake"] } # bdwgc
regex = "1.11"                # re2 (RE2 semantics: linear time, no backrefs)
backtrace = "0.3"             # libbacktrace
gimli = "0.34"               # DWARF/LSDA parsing for the exception personality
object = "0.41"
libz-rs-sys = { version = "0.6", features = ["gz", "export-symbols"] } # zlib-ng (gz* C ABI)
libbz2-rs-sys = { version = "0.2", features = ["export-symbols"] }     # bzip2 (BZ2_* C ABI)
liblzma-sys = { version = "0.4", features = ["static"] }               # xz / lzma
num-complex = "0.4"
libm = "0.2"
mimalloc = { version = "0.1", default-features = false }
accelerate-src = "0.3"
cblas-sys = "0.3"
blas-src = { version = "0.14", default-features = false }
glidesort = "0.1"            # numpy sort kernels (highway vqsort replacement)
pulp = "0.22"                # portable SIMD (highway replacement)
# OpenMP runtime (`__kmpc_*` / `omp_*` C ABI) implemented in Rust (replaces LLVM libomp)
crossbeam-utils = "0.8"      # CachePadded, Backoff
crossbeam-deque = "0.8"      # work-stealing task queues
cc = "1.2"                   # tiny C shim for the variadic __kmpc_fork_call

# Jupyter kernel and Python bridges are out of scope: no pyo3 / jupyter-protocol / zeromq deps.

# ---- testing ----
libtest-mimic = "0.8"         # parametrized .py tests
insta = "1.43"
pretty_assertions = "1.4"

[profile.dev]
opt-level = 1
# Disk is tight on the dev machine and LLVM-linked test binaries are large.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
